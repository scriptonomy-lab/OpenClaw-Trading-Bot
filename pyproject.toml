[project]
name = "openclaw-trading-bot"
version = "0.1.0"
description = "Describe a strategy on Telegram, backtest it on EODHD data, then paper trade it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[project.scripts]
openclaw-bot = "bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["bot"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real EODHD API (needs EODHD_API_KEY and costs API calls)",
    "slow: end-to-end tests on fake data; skipped by the pre-commit quick suite, run on pre-push",
]
addopts = "-m 'not integration'"

[tool.ruff.lint.per-file-ignores]
# The first notebook cell sets EODHD_MODE before importing the project.
"notebooks/*.ipynb" = ["E402"]
